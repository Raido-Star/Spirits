; NexusForge STM32 UART Example
; PlatformIO Project Configuration

[env:nucleo_f401re]
platform = ststm32
board = nucleo_f401re
framework = arduino

; Serial Monitor options
monitor_speed = 115200

; Build flags
build_flags =
    -DHAL_UART_MODULE_ENABLED
    -DUSE_FULL_ASSERT

; Libraries
lib_deps =
    STM32duino/STM32duino FreeRTOS@^10.3.1

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink

monitor_speed = 115200

lib_deps =
    STM32duino/STM32duino FreeRTOS@^10.3.1
