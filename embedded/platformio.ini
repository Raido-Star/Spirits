; NexusForge Global PlatformIO Configuration
; This is a template - copy to your project directory

[platformio]
; Default environments
default_envs =
    esp32dev
    ; uno
    ; nucleo_f401re

; Common settings
core_dir = .platformio
build_dir = build

[common]
; Common build flags
build_flags =
    -DNEXUSFORGE_VERSION="1.0.0"
    -Wall
    -Wextra

; Common libraries
lib_deps =
    ; Add your common libraries here

; ===========================
; ESP32 Environments
; ===========================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    ${common.build_flags}
    -DESP32
lib_deps =
    ${common.lib_deps}

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    ${common.build_flags}
    -DESP32S3

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    ${common.build_flags}
    -DESP32C3

; ===========================
; Arduino Environments
; ===========================

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_flags =
    ${common.build_flags}
    -DARDUINO_UNO

[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags =
    ${common.build_flags}
    -DARDUINO_MEGA

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
build_flags =
    ${common.build_flags}
    -DARDUINO_NANO

; ===========================
; STM32 Environments
; ===========================

[env:nucleo_f401re]
platform = ststm32
board = nucleo_f401re
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
build_flags =
    ${common.build_flags}
    -DSTM32F401xE

[env:bluepill]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
build_flags =
    ${common.build_flags}
    -DSTM32F103xB

[env:blackpill]
platform = ststm32
board = blackpill_f411ce
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
build_flags =
    ${common.build_flags}
    -DSTM32F411xE
